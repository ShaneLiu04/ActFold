    <text x="176" y="800" font-size="76" font-weight="bold" fill="#2dd4bf">2.3–2.7×</text>
    <text x="176" y="862" font-size="26" fill="#7c8db0">folded forward vs recompute</text>
    <text x="176" y="898" font-size="26" fill="#7c8db0">(all-stable fast path)</text>

    <rect x="553" y="690" width="386" height="250" rx="20" fill="#0d1729" stroke="#223455"/>
    <text x="589" y="800" font-size="76" font-weight="bold" fill="#4ade80">1.93×</text>
    <text x="589" y="862" font-size="26" fill="#7c8db0">intra-layer FFN split</text>
    <text x="589" y="898" font-size="26" fill="#7c8db0">(batch×seq ≥ 512)</text>

    <rect x="966" y="690" width="386" height="250" rx="20" fill="#0d1729" stroke="#223455"/>
    <text x="1002" y="800" font-size="76" font-weight="bold" fill="#fbbf24">3.43×</text>
    <text x="1002" y="862" font-size="26" fill="#7c8db0">fused gather-select kernel</text>
    <text x="1002" y="898" font-size="26" fill="#7c8db0">(T = 8192)</text>

    <text x="140" y="1040" font-size="26" fill="#5b6c8c">Target: 21–62% verification TFLOPs reduction · 204 regression tests · 10 engineering fixes</text>
    <text x="150" y="1152" font-size="26" fill="#5b6c8c">github.com/ShaneLiu04/ActFold</text>
    <text x="2410" y="1152" font-size="26" fill="#5b6c8c" text-anchor="end">Branch Folding for diffusion LLM speculative decoding</text>
  </g>

