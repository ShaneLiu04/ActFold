  <text x="140" y="205" font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="30" letter-spacing="6" fill="#5eead4">DIFFUSION LLM · SPECULATIVE DECODING</text>

  <text x="132" y="400" font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="170" font-weight="bold" fill="url(#titleGrad)">ActFold</text>

  <text x="140" y="480" font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="40" fill="#9fb0cc">Cross-Branch Activation Reuse for</text>
  <text x="140" y="532" font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="40" fill="#9fb0cc">Diffusion LLM Speculative Decoding</text>

  <g font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="27" fill="#a9bad8">
