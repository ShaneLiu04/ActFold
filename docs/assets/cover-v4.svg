<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a14"/>
      <stop offset="0.55" stop-color="#0b1e33"/>
      <stop offset="1" stop-color="#0a2630"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#818cf8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#7dd3fc" fill-opacity="0.30"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowbar" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)" opacity="0.24"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#accent)"/>
  <rect x="96" y="118" width="3" height="414" rx="1.5" fill="url(#accent)" opacity="0.8"/>

  <g font-family="'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">
    <rect x="782" y="140" width="336" height="32" rx="16" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="950" y="161" text-anchor="middle" font-size="13" fill="#7dd3fc">AR022 最新头条 &#183; 贪心锚定候选</text>

    <text x="950" y="272" text-anchor="middle" font-size="118" font-weight="800" fill="url(#title)" filter="url(#soft)">7.02&#215;</text>
    <text x="950" y="300" text-anchor="middle" font-size="15" fill="#94a3b8">vs baseline &#183; p50 440.9ms（Fast-dLLM-v2-1.5B 真实生成回路）</text>

    <text x="690" y="336" font-size="12.5" fill="#64748b">真实生成回路 wall-clock p50（贪心锚定基准，越低越好）</text>

    <rect x="690" y="348" width="520" height="34" rx="9" fill="#94a3b8" fill-opacity="0.14" stroke="#475569" stroke-width="1.2"/>
    <text x="708" y="370" font-size="14" fill="#94a3b8">baseline</text>

    <rect x="690" y="396" width="74.0" height="34" rx="9" fill="url(#barGrad)" fill-opacity="0.75" filter="url(#glowbar)"/>
    <text x="776" y="418" font-size="14" fill="#a5f3fc">actfold &#183; 440.9ms</text>

    <text x="950" y="462" text-anchor="middle" font-size="14" fill="#94a3b8">质量 gap = 0.0（posthoc 逐位 == baseline &#183; 早停完全恢复 &#183; 块级 exact 4/4）</text>
    <text x="950" y="492" text-anchor="middle" font-size="14" fill="#64748b">AR021 生产生成回路：batched 2.38&#215; vs baseline &#183; 输出逐位一致</text>
  </g>

  <g font-family="'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">
    <rect x="96" y="88" width="446" height="34" rx="17" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="319" y="110" text-anchor="middle" font-size="13.5" letter-spacing="2.2" fill="#7dd3fc">DIFFUSION LLM &#183; SPECULATIVE DECODING</text>

    <text x="96" y="212" font-size="116" font-weight="800" fill="url(#title)" filter="url(#soft)">ActFold</text>
    <text x="98" y="260" font-size="28" font-weight="600" fill="#cbd5e1">Cross-Branch Activation Reuse</text>
    <text x="98" y="292" font-size="19" fill="#94a3b8"
          textLength="440" lengthAdjust="spacing">Speculative Decoding for Diffusion LLMs</text>
    <text x="98" y="324" font-size="18" fill="#7dd3fc"
          textLength="360" lengthAdjust="spacing">面向 Diffusion LLM 投机解码的跨分支激活复用</text>

    <g font-size="16" fill="#e2e8f0">
      <rect x="98" y="350" rx="15" width="86" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="141" y="371" text-anchor="middle">Python</text>
      <rect x="194" y="350" rx="15" width="94" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="241" y="371" text-anchor="middle">PyTorch</text>
      <rect x="298" y="350" rx="15" width="76" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="336" y="371" text-anchor="middle">Triton</text>
      <rect x="384" y="350" rx="15" width="68" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="418" y="371" text-anchor="middle">CUDA</text>
      <rect x="462" y="350" rx="15" width="52" height="32" fill="#0f172a" stroke="#334155"/>
      <text x="488" y="371" text-anchor="middle">CI</text>
    </g>

    <g font-size="16">
      <rect x="98" y="400" rx="14" width="560" height="38" fill="#082f38" stroke="#22d3ee" stroke-opacity="0.55"/>
      <circle cx="120" cy="419" r="4" fill="#22d3ee"/>
      <text x="136" y="425" fill="#a5f3fc" textLength="504" lengthAdjust="spacing">贪心锚定候选 7.02× vs baseline（质量 gap=0.0 · 早停恢复 · 块级 exact 4/4）</text>

      <rect x="98" y="448" rx="14" width="560" height="38" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.55"/>
      <circle cx="120" cy="467" r="4" fill="#818cf8"/>
      <text x="136" y="473" fill="#c7d2fe" textLength="504" lengthAdjust="spacing">生产生成回路折叠 2.38×/2.47× vs baseline/serial（真实 checkpoint 逐位一致）</text>

      <rect x="98" y="496" rx="14" width="560" height="38" fill="#0f2a23" stroke="#34d399" stroke-opacity="0.5"/>
      <circle cx="120" cy="515" r="4" fill="#34d399"/>
      <text x="136" y="521" fill="#a7f3d0" textLength="504" lengthAdjust="spacing">验证阶段 TFLOPs 目标 −21%~−62% · 折叠前向 2.3–2.7× · Triton 3.43×</text>
    </g>

    <text x="98" y="598" font-size="15" fill="#64748b"
          textLength="560" lengthAdjust="spacing">ShaneLiu04 &#183; github.com/ShaneLiu04/ActFold &#183; gitee.com/liu-xingyan04/act-fold</text>
  </g>
</svg>
