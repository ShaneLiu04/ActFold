    <rect x="690" y="182" width="520" height="86" rx="14" fill="#0d1b2e" stroke="url(#accent)" stroke-opacity="0.85" stroke-width="1.5"/>
    <rect x="690" y="182" width="520" height="86" rx="14" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="8" filter="url(#glowbar)"/>
    <text x="710" y="216" font-size="17" font-weight="600" fill="#e2e8f0">Fast-dLLM-v2-1.5B</text>
    <text x="710" y="242" font-size="12.5" fill="#94a3b8">真实生成回路 · 质量 gap=0.0（逐位对齐 baseline）</text>
    <text x="1190" y="236" text-anchor="end" font-size="40" font-weight="800" fill="url(#title)">7.02×</text>
    <rect x="690" y="282" width="520" height="86" rx="14" fill="#0d1b2e" stroke="#334155" stroke-opacity="0.9" stroke-width="1.2"/>
    <text x="710" y="316" font-size="17" font-weight="600" fill="#e2e8f0">LLaDA-8B</text>
    <text x="710" y="342" font-size="12.5" fill="#94a3b8">quick 冒烟 · 端到端折叠投机（质量面治理 AR024 进行中）</text>
    <text x="1190" y="336" text-anchor="end" font-size="40" font-weight="800" fill="#a5b4fc">5.41×</text>
    <rect x="690" y="382" width="520" height="86" rx="14" fill="#0d1b2e" stroke="#334155" stroke-opacity="0.9" stroke-width="1.2"/>
    <text x="710" y="416" font-size="17" font-weight="600" fill="#e2e8f0">Dream-7B</text>
    <text x="710" y="442" font-size="12.5" fill="#94a3b8">quick 冒烟 · 长度恢复 64/64/64 ✓（exact 严格改善）</text>
    <text x="1190" y="436" text-anchor="end" font-size="40" font-weight="800" fill="#a5b4fc">1.35×</text>

    <text x="950" y="504" text-anchor="middle" font-size="13" fill="#64748b">LLaDA / Dream 为 quick 冒烟尺度机制验证 · 正式基准（reps=30）进行中</text>
    <text x="950" y="530" text-anchor="middle" font-size="13" fill="#64748b">AR024：LLaDA 提交粒度质量面治理（req 阶段进行中）</text>
