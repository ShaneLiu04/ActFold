    <rect x="840" y="369" width="18" height="18" rx="4" fill="#082f38" stroke="#22d3ee" stroke-opacity="0.5"/>
    <line x1="864" y1="378" x2="880" y2="378" stroke="#64748b" stroke-opacity="0.7" stroke-width="1.2"/>
    <line x1="880" y1="238" x2="880" y2="378" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.6"/>
    <line x1="880" y1="308" x2="898" y2="308" stroke="#818cf8" stroke-opacity="0.85" stroke-width="1.8"/>
    <polygon points="908,308 896,302 896,314" fill="#818cf8"/>

    <rect x="908" y="210" width="287" height="150" rx="16" fill="#0d1b2e" stroke="url(#accent)" stroke-opacity="0.85" stroke-width="1.5"/>
    <rect x="908" y="210" width="287" height="150" rx="16" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="8" filter="url(#glowpanel)"/>
    <text x="1051" y="252" text-anchor="middle" font-size="17" font-weight="600" fill="#e2e8f0">单次合并批量前向</text>
    <text x="1051" y="302" text-anchor="middle" font-size="46" font-weight="800" fill="url(#title)">1&#215;</text>
    <text x="1051" y="330" text-anchor="middle" font-size="13" fill="#94a3b8">[&#931;N, T] &#183; vs 逐链 N 次调用</text>

    <rect x="690" y="420" width="245" height="34" rx="17" fill="#0f2a23" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="812" y="442" text-anchor="middle" font-size="14" fill="#a7f3d0">16/16 机制面 supported</text>
    <rect x="955" y="420" width="245" height="34" rx="17" fill="#082f38" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="1077" y="442" text-anchor="middle" font-size="14" fill="#a5f3fc">写操作 −90~97.5%</text>

    <text x="950" y="492" text-anchor="middle" font-size="12.5" fill="#64748b">2/4 父 &#215; 4/8 候选 &#215; T 256/1024 &#183; 双构建（nonsplit 位级 / split allclose 1e-6）</text>
    <text x="950" y="514" text-anchor="middle" font-size="12.5" fill="#64748b">AR024:LLaDA 提交粒度质量面治理 — 设计完成（门控 PASS），实施待启动</text>
  </g>

  <g font-family="'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">
    <rect x="96" y="88" width="446" height="34" rx="17" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.35"/>
