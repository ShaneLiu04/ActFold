    <rect x="840" y="299" width="18" height="18" rx="4" fill="#082f38" stroke="#22d3ee" stroke-opacity="0.5"/>
    <line x1="864" y1="308" x2="880" y2="308" stroke="#64748b" stroke-opacity="0.7" stroke-width="1.2"/>
    <rect x="690" y="365" width="64" height="26" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
    <text x="722" y="383" text-anchor="middle" font-size="13" fill="#cbd5e1">P3</text>
    <rect x="768" y="369" width="18" height="18" rx="4" fill="#082f38" stroke="#22d3ee" stroke-opacity="0.5"/>
