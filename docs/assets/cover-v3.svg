    <path d="M690,505 L690,488 Q690,479 699,479 L756,479 Q765,479 765,488 L765,505 Z" fill="#22d3ee" fill-opacity="0.13" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="1.5"/>
    <path d="M779,505 L779,458 Q779,449 788,449 L845,449 Q854,449 854,458 L854,505 Z" fill="#35c5f0" fill-opacity="0.13" stroke="#35c5f0" stroke-opacity="0.8" stroke-width="1.5"/>
    <path d="M868,505 L868,428 Q868,419 877,419 L934,419 Q943,419 943,428 L943,505 Z" fill="#48b7f2" fill-opacity="0.13" stroke="#48b7f2" stroke-opacity="0.8" stroke-width="1.5"/>
    <path d="M957,505 L957,398 Q957,389 966,389 L1023,389 Q1032,389 1032,398 L1032,505 Z" fill="#5ba8f4" fill-opacity="0.13" stroke="#5ba8f4" stroke-opacity="0.8" stroke-width="1.5"/>
    <path d="M1046,505 L1046,368 Q1046,359 1055,359 L1112,359 Q1121,359 1121,368 L1121,505 Z" fill="#6e9af6" fill-opacity="0.13" stroke="#6e9af6" stroke-opacity="0.8" stroke-width="1.5"/>
    <path d="M1135,505 L1135,338 Q1135,329 1144,329 L1201,329 Q1210,329 1210,338 L1210,505 Z" fill="#818cf8" fill-opacity="0.26" stroke="#818cf8" stroke-opacity="0.8" stroke-width="1.5" filter="url(#glowLine)"/>
    <text x="727" y="524" text-anchor="middle" font-size="10.5" fill="#64748b">AR015</text>
    <text x="727" y="539" text-anchor="middle" font-size="11" fill="#94a3b8">批量前向</text>
    <text x="816" y="524" text-anchor="middle" font-size="10.5" fill="#64748b">AR016</text>
    <text x="816" y="539" text-anchor="middle" font-size="11" fill="#94a3b8">批量 Graph</text>
    <text x="905" y="524" text-anchor="middle" font-size="10.5" fill="#64748b">AR017</text>
    <text x="905" y="539" text-anchor="middle" font-size="11" fill="#94a3b8">自适应容量</text>
    <text x="994" y="524" text-anchor="middle" font-size="10.5" fill="#64748b">AR018</text>
    <text x="994" y="539" text-anchor="middle" font-size="11" fill="#94a3b8">发布压缩</text>
    <text x="1083" y="524" text-anchor="middle" font-size="10.5" fill="#64748b">AR019</text>
    <text x="1083" y="539" text-anchor="middle" font-size="11" fill="#94a3b8">真实 ckpt</text>
    <text x="1172" y="524" text-anchor="middle" font-size="10.5" fill="#64748b">AR020</text>
    <text x="1172" y="539" text-anchor="middle" font-size="11" fill="#94a3b8">put 批量化</text>

    <line x1="690" y1="506" x2="1210" y2="506" stroke="#334155" stroke-opacity="0.9" stroke-width="1"/>

    <text x="1215" y="300" text-anchor="end" font-size="42" font-weight="800" fill="url(#title)">2.40–2.67&#215;</text>
    <text x="1215" y="322" text-anchor="end" font-size="13" fill="#94a3b8">端到端 &#183; Fast-dLLM-v2-1.5B 真实 checkpoint</text>

    <text x="950" y="566" text-anchor="middle" font-size="14" fill="#64748b">P1-7 六档优化阶梯 &#183; 各档独立实测 &#183; 全链输出逐位一致</text>
  </g>

  <g font-family="'Segoe UI','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif">
