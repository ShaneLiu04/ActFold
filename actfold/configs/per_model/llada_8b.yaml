# Configuration for LLaDA-8B.

# Similarity gating
tau: 0.95
metric: "cosine"

# Activation cache
max_entries_per_layer: 2048

# Dynamic threshold scheduling
enable_dynamic_tau: true

# Device and seed
device: "cuda"
seed: 42

# Architecture (overridden when model_name_or_path is loaded).
num_layers: 32
hidden_dim: 4096
num_heads: 32
seq_len: 256
vocab_size: 32000
num_steps: 10

# Real model configuration.
# Replace with the actual LLaDA-8B checkpoint path or HF identifier.
model_name_or_path: null
model_family: "llada"
trust_remote_code: true
use_fast_tokenizer: true
load_in_8bit: false
load_in_4bit: false
torch_dtype: null
device_map: null

# Cross-family speculative block verification (AR023). Default OFF — the
# reference remasking recipe runs unchanged. The operational fields and
# their validation live on LLaDASamplerConfig; uncomment to enable:
# num_block_candidates: 4
# candidate_top_k: 10
# candidate_include_greedy: true

# LLaDA commit-granularity (AR024). Defaults: s=8 sub-block windows with
# the EOS-aware continuation row on (the recommended AR024 stack once the
# speculative path is enabled); progressive refill stays OFF (opt-in).
# A/B anchor restoration of the AR023 semantics:
# speculative_sub_block_size: <block_size> + candidate_eos_aware: false.
# speculative_sub_block_size: 8
# candidate_eos_aware: true
# progressive_refill: false
# refill_top_k: null

# Evaluation backend configuration.
use_real_eval: true
eval_backend: "auto"
eval_batch_size: 1
eval_num_fewshot: null
eval_limit: null
eval_base_only: false
